<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink harness</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    :root {
      --background-primary: #fff; --background-secondary: #f5f5f7; --background-modifier-border: #ddd;
      --background-modifier-hover: #eee; --interactive-accent: #7c3aed; --text-on-accent: #fff;
      --text-normal: #222; --text-muted: #888; --text-error: #c00; --radius-m: 8px; --radius-s: 4px;
      --font-ui-smaller: 12px;
    }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fafafa; }
    #app { max-width: 760px; margin: 0 auto; }
    button { font: inherit; border: none; border-radius: 4px; background: transparent; min-width: 28px; height: 28px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="harness.js"></script>
</body>
</html>
